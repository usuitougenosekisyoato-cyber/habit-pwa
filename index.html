<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="毎日の習慣をチェックして、連続日数と今月の記録を見るアプリ">
  <meta name="theme-color" content="#2f7d5b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="習慣">
  <title>習慣トラッカー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="update-banner" class="banner" role="status" hidden>
    <span>新しい版があります</span>
    <button id="update-button" type="button">更新する</button>
  </div>

  <header class="app-header">
    <h1>習慣トラッカー</h1>
    <p id="today-label" class="today-label"></p>
  </header>

  <main>
    <section class="card" aria-labelledby="add-title">
      <h2 id="add-title">習慣を追加</h2>
      <form id="add-form" class="add-form" autocomplete="off">
        <input id="habit-name" name="name" type="text" maxlength="30" placeholder="例: 散歩する" aria-label="習慣の名前" enterkeyhint="done">
        <button type="submit">追加</button>
      </form>
      <p id="add-message" class="message" role="status"></p>
    </section>

    <section class="card" aria-labelledby="today-title">
      <h2 id="today-title">今日のチェック</h2>
      <ul id="habit-list" class="habit-list"></ul>
      <p id="empty-message" class="empty">まだ習慣がありません。上の欄から追加してください。</p>
    </section>

    <section class="card" aria-labelledby="month-title">
      <h2 id="month-title">今月の記録</h2>
      <label class="select-label" id="month-select-label">
        <span>習慣</span>
        <select id="month-habit"></select>
      </label>
      <p id="month-summary" class="month-summary"></p>
      <div id="calendar" class="calendar" aria-label="今月のカレンダー"></div>
    </section>

    <section class="card" aria-labelledby="backup-title">
      <h2 id="backup-title">バックアップ</h2>
      <p class="hint">データはこの端末のブラウザの中だけに保存されています。機種変更やブラウザのデータ削除の前に、書き出して保存しておいてください。</p>
      <div class="backup-buttons">
        <button id="export-button" type="button" class="secondary">書き出す</button>
        <button id="import-button" type="button" class="secondary">読み込む</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <div id="backup-message" class="message" role="status"></div>
    </section>
  </main>

  <dialog id="import-dialog" aria-labelledby="import-dialog-title">
    <form method="dialog">
      <h2 id="import-dialog-title">今のデータを置き換えますか?</h2>
      <dl class="compare">
        <div>
          <dt>今のデータ</dt>
          <dd id="current-summary"></dd>
        </div>
        <div>
          <dt>読み込むデータ</dt>
          <dd id="incoming-summary"></dd>
        </div>
      </dl>
      <p class="warn">置き換えると、今のデータは元に戻せません。残しておきたいときは、先に「やめる」を押して「書き出す」で保存してください。</p>
      <div class="dialog-buttons">
        <button value="cancel" class="secondary">やめる</button>
        <button value="replace" class="danger">置き換える</button>
      </div>
    </form>
  </dialog>
</body>
</html>
